name: Water Cut Check

on:
  schedule:
    # Time 1: 4:23 PM IST (which is 10:53 UTC)
    - cron: '53 10 * * *'
    # Time 2: 10:35 PM IST (which is 17:05 UTC)
    - cron: '5 17 * * *'

  # This allows you to run it manually if needed
  workflow_dispatch:

# Forces GitHub to use Node 24 and stops the warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -U feedparser requests google-genai pytz beautifulsoup4

      # Adding a small random delay prevents the bot from running at the
      # exact same millisecond every day, making it look more human.
      - name: Random Sleep Delay
        run: |
          import time, random
          time.sleep(random.randint(1, 120))
        shell: python

      - name: Run Water Cut Alert
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID:        ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
        run: python Watercutalert.py
