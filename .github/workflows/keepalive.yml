name: Keep Alive

on:
  schedule:
    - cron: '0 0 1,15 * *'  # Runs on 1st and 15th of every month
  workflow_dispatch:

permissions:
  contents: write       # allow GITHUB_TOKEN to push commits
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          branch: main
          commit_message: "Keepalive ping"

