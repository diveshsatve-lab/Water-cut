name: Keep Alive

on:
  schedule:
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create keepalive commit
        run: |
          date > keepalive.txt
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add keepalive.txt
          git commit -m "Keepalive ping" || echo "No changes to commit"
          git push
